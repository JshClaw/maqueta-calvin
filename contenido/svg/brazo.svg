<svg viewBox="0 -10 1080 501" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brazo, palo y perilla vistos desde arriba y de lado" class="plano"><title>Brazo, palo y perilla vistos desde arriba y de lado</title><rect x="30" y="74" width="780" height="65" rx="3" class="mdf"/><line x1="420" y1="60" x2="420" y2="153" class="axis"/><circle cx="420" cy="106.5" r="16.51" class="shaft"/><circle cx="794.4" cy="106.5" r="15.6" class="magnet"/><rect x="30" y="80.5" width="52" height="52" class="felt dashed"/><rect x="758" y="80.5" width="52" height="52" class="felt dashed"/><g class="dim"><line x1="30" y1="40" x2="810" y2="40"/><line x1="30" y1="34" x2="30" y2="46"/><line x1="810" y1="34" x2="810" y2="46"/><path d="M30,40 l7,-3 v6 z M810,40 l-7,-3 v6 z" class="arrow"/></g><text x="420" y="34" class="dimt" text-anchor="middle" font-size="12">30 cm · tira de MDF de 6 mm, 2.5 cm de ancho</text><g class="dim"><line x1="420" y1="173" x2="794.4" y2="173"/><line x1="420" y1="167" x2="420" y2="179"/><line x1="794.4" y1="167" x2="794.4" y2="179"/><path d="M420,173 l7,-3 v6 z M794.4,173 l-7,-3 v6 z" class="arrow"/></g><text x="607.2" y="188" class="dimt" text-anchor="middle" font-size="11.5">14.4 cm al centro de los imanes</text><text x="810" y="217" class="tl" text-anchor="end" font-size="11">Derecha: 2 imanes de 12 × 3 mm encimados, al ras</text><text x="30" y="217" class="tl" text-anchor="start" font-size="11">Sombreado: fieltro de 2 × 2 cm arriba, en las dos puntas</text><text x="420" y="239" class="tl" text-anchor="middle" font-size="11">Al centro: agujero de ½″ donde entra el palo, al ras por abajo</text><text x="30" y="283" class="tb" text-anchor="start" font-size="12">De lado: así se apila</text><rect x="30" y="437" width="780" height="24" class="mdf"/><rect x="778.8" y="437" width="31.2" height="24" class="magnet"/><rect x="30" y="429" width="52" height="8" class="felt"/><rect x="758" y="429" width="52" height="8" class="felt"/><rect x="30" y="405" width="780" height="24" class="mdf ghost"/><rect x="384.9" y="397" width="70.2" height="8" class="metal2"/><rect x="361.5" y="373" width="117" height="24" class="mdf"/><rect x="361.5" y="349" width="117" height="24" class="mdf"/><rect x="403.49" y="301" width="33.02" height="160" class="pine"/><path d="M427.8,317 L830,307 H840" class="lead"/><circle cx="427.8" cy="317" r="2.4" class="leaddot"/><text x="844" y="311" class="tl" text-anchor="start" font-size="11.5">palo de ½″, 4 cm (sobresale 1.2 cm)</text><path d="M468.1,361 L830,337.8 H840" class="lead"/><circle cx="468.1" cy="361" r="2.4" class="leaddot"/><text x="844" y="341.8" class="tl" text-anchor="start" font-size="11.5">perilla: 2 discos de Ø 4.5 cm</text><path d="M447.3,401 L830,368.6 H840" class="lead"/><circle cx="447.3" cy="401" r="2.4" class="leaddot"/><text x="844" y="372.6" class="tl" text-anchor="start" font-size="11.5">rondana de ½″ sobre la tapa</text><path d="M654,417 L830,399.4 H840" class="lead"/><circle cx="654" cy="417" r="2.4" class="leaddot"/><text x="844" y="403.4" class="tl" text-anchor="start" font-size="11.5">tapa de 6 mm (agujero de ⅝″)</text><path d="M784,433 L830,430.2 H840" class="lead"/><circle cx="784" cy="433" r="2.4" class="leaddot"/><text x="844" y="434.2" class="tl" text-anchor="start" font-size="11.5">fieltro de 2 mm: toca la tapa</text><path d="M654,449 L830,461 H840" class="lead"/><circle cx="654" cy="449" r="2.4" class="leaddot"/><text x="844" y="465" class="tl" text-anchor="start" font-size="11.5">brazo de MDF, imanes al ras</text><text x="794.4" y="479" class="tl" text-anchor="middle" font-size="11">imanes</text></svg>