<svg viewBox="0 -10 1106 501" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brazo, palo y perilla vistos desde arriba y de lado" class="plano"><title>Brazo, palo y perilla vistos desde arriba y de lado</title><rect x="30" y="74" width="806" height="65" rx="3" class="mdf"/><line x1="433" y1="60" x2="433" y2="153" class="axis"/><circle cx="433" cy="106.5" r="16.51" class="shaft"/><circle cx="807.4" cy="106.5" r="15.6" class="magnet"/><rect x="30" y="80.5" width="52" height="52" class="felt dashed"/><rect x="784" y="80.5" width="52" height="52" class="felt dashed"/><g class="dim"><line x1="30" y1="40" x2="836" y2="40"/><line x1="30" y1="34" x2="30" y2="46"/><line x1="836" y1="34" x2="836" y2="46"/><path d="M30,40 l7,-3 v6 z M836,40 l-7,-3 v6 z" class="arrow"/></g><text x="433" y="34" class="dimt" text-anchor="middle" font-size="12">31 cm · tira de MDF de 6 mm, 2.5 cm de ancho</text><g class="dim"><line x1="433" y1="173" x2="807.4" y2="173"/><line x1="433" y1="167" x2="433" y2="179"/><line x1="807.4" y1="167" x2="807.4" y2="179"/><path d="M433,173 l7,-3 v6 z M807.4,173 l-7,-3 v6 z" class="arrow"/></g><text x="620.2" y="188" class="dimt" text-anchor="middle" font-size="11.5">14.4 cm al centro de los imanes</text><text x="836" y="217" class="tl" text-anchor="end" font-size="11">Derecha: 2 imanes de 12 × 3 mm encimados, al ras</text><text x="30" y="217" class="tl" text-anchor="start" font-size="11">Sombreado: fieltro de 2 × 2 cm arriba, en las dos puntas</text><text x="433" y="239" class="tl" text-anchor="middle" font-size="11">Al centro: agujero de ½″ donde entra el palo, al ras por abajo</text><text x="30" y="283" class="tb" text-anchor="start" font-size="12">De lado: así se apila</text><rect x="30" y="437" width="806" height="24" class="mdf"/><rect x="791.8" y="437" width="31.2" height="24" class="magnet"/><rect x="30" y="429" width="52" height="8" class="felt"/><rect x="784" y="429" width="52" height="8" class="felt"/><rect x="30" y="405" width="806" height="24" class="mdf ghost"/><rect x="397.9" y="397" width="70.2" height="8" class="metal2"/><rect x="374.5" y="373" width="117" height="24" class="mdf"/><rect x="374.5" y="349" width="117" height="24" class="mdf"/><rect x="416.49" y="301" width="33.02" height="160" class="pine"/><path d="M440.8,317 L856,307 H866" class="lead"/><circle cx="440.8" cy="317" r="2.4" class="leaddot"/><text x="870" y="311" class="tl" text-anchor="start" font-size="11.5">palo de ½″, 4 cm (sobresale 1.2 cm)</text><path d="M481.1,361 L856,337.8 H866" class="lead"/><circle cx="481.1" cy="361" r="2.4" class="leaddot"/><text x="870" y="341.8" class="tl" text-anchor="start" font-size="11.5">perilla: 2 discos de Ø 4.5 cm</text><path d="M460.3,401 L856,368.6 H866" class="lead"/><circle cx="460.3" cy="401" r="2.4" class="leaddot"/><text x="870" y="372.6" class="tl" text-anchor="start" font-size="11.5">rondana de ½″ sobre la tapa</text><path d="M667,417 L856,399.4 H866" class="lead"/><circle cx="667" cy="417" r="2.4" class="leaddot"/><text x="870" y="403.4" class="tl" text-anchor="start" font-size="11.5">tapa de 6 mm (agujero de ⅝″)</text><path d="M810,433 L856,430.2 H866" class="lead"/><circle cx="810" cy="433" r="2.4" class="leaddot"/><text x="870" y="434.2" class="tl" text-anchor="start" font-size="11.5">fieltro de 2 mm: toca la tapa</text><path d="M667,449 L856,461 H866" class="lead"/><circle cx="667" cy="449" r="2.4" class="leaddot"/><text x="870" y="465" class="tl" text-anchor="start" font-size="11.5">brazo de MDF, imanes al ras</text><text x="807.4" y="479" class="tl" text-anchor="middle" font-size="11">imanes</text></svg>