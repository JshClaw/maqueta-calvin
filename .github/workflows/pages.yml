# Publica dist/ en GitHub Pages cada vez que cambia (o a mano desde la pestaña Actions).
# En el repositorio: Settings > Pages > Source: GitHub Actions.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dist/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
